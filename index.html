<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta name="description" content="登高作业安全调查与互动找茬训练：人字梯、移动式门式脚手架">
  <title>登高作业安全调查｜互动训练</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a2342'/%3E%3Cpath d='M18 52 29 12h6l11 40M22 39h20M25 29h14M27 20h10' fill='none' stroke='%23ffd23f' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#091c31;--navy:#0a2342;--cyan:#36c5f0;--yellow:#ffd23f;--red:#e4493f;--green:#08a66c;--paper:#f4f7fa;--muted:#617286;--line:#d8e2ec;--shadow:0 18px 50px rgba(8,30,55,.16)}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}button{font:inherit}
    .topbar{background:var(--navy);color:#fff;padding:14px clamp(16px,3vw,38px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;border-bottom:5px solid var(--yellow)}
    .brand{display:flex;align-items:center;gap:12px}.badge{width:44px;height:44px;border-radius:12px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:950;font-size:1.45rem;transform:rotate(-3deg)}
    h1{font-size:clamp(1.08rem,2.3vw,1.65rem);line-height:1.2;margin:0}.sub{margin:4px 0 0;color:#c7d8e9;font-size:.88rem}
    .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:94px;background:#ffffff12;border:1px solid #ffffff25;border-radius:12px;padding:8px 12px;text-align:center}.stat strong{display:block;color:var(--yellow);font-size:1.12rem}.stat span{font-size:.74rem;color:#d8e5f2}
    main{width:min(1480px,100%);margin:auto;padding:18px clamp(12px,2.2vw,30px) 30px}.mission{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:13px}.mission p{margin:0;font-weight:800;font-size:clamp(.95rem,1.4vw,1.1rem)}.mission small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:9px 14px;font-weight:850;cursor:pointer}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .qr-entry{display:grid;grid-template-columns:82px 180px;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:0 6px 20px #0a23420f}.qr-entry img{width:82px;height:82px;image-rendering:pixelated}.qr-entry b{display:block;font-size:.88rem}.qr-entry span{display:block;color:var(--muted);font-size:.76rem;line-height:1.35;margin-top:3px}
    .progress{height:8px;background:#dfe8f0;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress>span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--yellow));transition:width .35s ease}
    .stage{position:relative;border-radius:18px;overflow:hidden;background:#c9d4df;box-shadow:var(--shadow);border:1px solid #c5d1dc;isolation:isolate;cursor:crosshair;touch-action:manipulation;user-select:none}.stage img{width:100%;height:auto;display:block;pointer-events:none}.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff70}
    .marker{position:absolute;width:clamp(34px,4vw,58px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:4;animation:pop .28s ease both;color:#fff;font-weight:950;background:#08a66cd9;border:3px solid #fff;box-shadow:0 0 0 5px #08a66c66,0 8px 20px #081f3a66}.marker::after{content:"✓"}.marker.answer::after{content:attr(data-label)}
    .param-label{position:absolute;z-index:3;max-width:min(210px,24vw);transform:translate(-50%,-50%);border:2px solid #245a82;background:#f5fbff;color:#0b3150;border-radius:10px;padding:7px 9px;font-size:clamp(.68rem,1vw,.86rem);line-height:1.22;font-weight:900;box-shadow:0 8px 24px #071a2c36;cursor:pointer}.param-label::before{content:"参数";display:inline-block;margin-right:5px;padding:1px 5px;border-radius:999px;background:#245a82;color:#fff;font-size:.68em}.param-label::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:24px;background:#245a82;transform:translateX(-50%)}
    .miss{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;background:#e4493fe6;color:#fff;display:grid;place-items:center;font-weight:950;z-index:5;animation:miss .75s ease forwards;pointer-events:none}.miss::after{content:"×"}@keyframes pop{from{opacity:0;scale:.4}to{opacity:1;scale:1}}@keyframes miss{0%{opacity:0;scale:.4}25%{opacity:1;scale:1}100%{opacity:0;scale:1.45}}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}.btn{border:0;border-radius:11px;padding:11px 17px;font-weight:850;cursor:pointer;min-height:46px;transition:transform .18s,box-shadow .18s,background .18s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--yellow);color:var(--navy);box-shadow:0 8px 20px #ffd23f44}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.danger{background:var(--navy);color:#fff}.hint{background:#e7f7fc;color:#075276}
    .feedback-card{display:none;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;margin-top:14px;padding:14px 16px;border-radius:14px;background:#eefaf4;border:1px solid #9bd8bd;box-shadow:0 8px 24px #082c1b18}.feedback-card.show{display:grid}.feedback-card.wrong{background:#fff3f1;border-color:#efb1aa}.feedback-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:950;font-size:1.15rem}.feedback-card.wrong .feedback-icon{background:var(--red)}.feedback-copy h2{font-size:1rem;margin:0 0 5px}.feedback-copy p{margin:3px 0;font-size:.88rem;line-height:1.5}.feedback-copy .why{color:#91401f}.feedback-copy .do{color:#0a6849;font-weight:750}.feedback-close{border:0;background:transparent;color:var(--muted);font-size:1.25rem;cursor:pointer;padding:0 4px}
    .note{text-align:center;color:var(--muted);font-size:.82rem;margin:12px 0 0}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#071a2c;color:#fff;border-radius:99px;padding:11px 18px;box-shadow:0 10px 35px #0005;transition:.25s;pointer-events:none;max-width:calc(100vw - 24px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:var(--green)}.toast.no{background:var(--red)}
    dialog{border:0;padding:0;border-radius:18px;width:min(920px,calc(100% - 24px));max-height:88vh;box-shadow:0 30px 90px #00152a66;color:var(--ink)}dialog::backdrop{background:#06182bd9;backdrop-filter:blur(5px)}.dialog-head{background:var(--navy);color:#fff;padding:22px 24px;position:sticky;top:0;z-index:2}.dialog-head h2{margin:0 40px 5px 0;font-size:1.3rem}.dialog-head p{margin:0;color:#c9d9e8;font-size:.9rem}.close{position:absolute;right:16px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff12;color:#fff;font-size:1.2rem;cursor:pointer}.dialog-body{padding:20px 24px 24px;background:#fff}.score-callout{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #b9d9cb;background:#eefaf4;border-radius:14px;margin-bottom:16px}.score-callout b{font-size:1.5rem;color:var(--green)}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start}.answer .n{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.answer h3{font-size:.95rem;margin:1px 0 4px}.answer p{font-size:.82rem;color:var(--muted);margin:0;line-height:1.5}.answer.found{border-color:#8bd4b5;background:#f1fbf6}.answer.found .n{background:var(--green)}.source{margin:17px 0 0;padding:13px 15px;background:#f3f6f9;border-radius:10px;color:#53677a;font-size:.8rem;line-height:1.55}
    @media(max-width:860px){.topbar,.mission{grid-template-columns:1fr}.stats{justify-content:flex-start}.stat{flex:1}.answers{grid-template-columns:1fr}.stage{border-radius:12px}.sub{display:none}.qr-entry{grid-template-columns:72px 1fr}.qr-entry img{width:72px;height:72px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="badge">查</div><div><h1>登高作业安全调查｜互动训练</h1><p class="sub">当前包含：人字梯、移动式门式脚手架。后续可继续加入直梯、登高车、曲臂车等设备。</p></div></div>
    <div class="stats" aria-live="polite"><div class="stat"><strong><span id="found">0</span> / <span id="total">12</span></strong><span>已找出</span></div><div class="stat"><strong id="attempts">0</strong><span>点击次数</span></div><div class="stat"><strong id="clock">00:00</strong><span>用时</span></div></div>
  </header>
  <main>
    <section class="mission">
      <p id="missionText">任务：找出图中的 12 处不安全行为或状态<small id="missionSub">命中后立即显示错误、危险和正确做法；最后统一讲评。</small></p>
      <aside class="qr-entry" aria-label="学员扫码登录入口"><img src="assets/学员登录二维码_GitHubPages入口.png" alt="学员扫码登录二维码"><div><b>学员扫码登录</b><span>微信扫码后通过 GitHub Pages 直接进入当前训练页面。</span></div></aside>
    </section>
    <nav class="tabs" aria-label="找茬场景切换"></nav>
    <div class="progress" aria-label="完成进度"><span id="progress"></span></div>
    <section class="stage" id="stage" role="application" aria-label="人字梯找茬场景，点击发现的错误位置"><img id="sceneImage" alt=""></section>
    <aside class="feedback-card" id="feedbackCard" aria-live="polite"><div class="feedback-icon" id="feedbackIcon">✓</div><div class="feedback-copy"><h2 id="feedbackTitle"></h2><p class="why" id="feedbackWhy"></p><p class="do" id="feedbackDo"></p></div><button class="feedback-close" id="feedbackClose" type="button" aria-label="关闭提示">×</button></aside>
    <div class="toolbar">
      <button class="btn hint" id="hintBtn" type="button">给我一个区域提示（3）</button>
      <button class="btn primary" id="submitBtn" type="button">提交并统一讲评</button>
      <button class="btn secondary" id="resetBtn" type="button">重新开始本场景</button>
      <button class="btn danger" id="teacherBtn" type="button">讲师直接揭晓</button>
    </div>
    <p class="note">训练样品 v0.8｜已加入移动式门式脚手架两个场景；图片、参数口径与热点仍需人工校准后再进正式课件。</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="answerDialog">
    <div class="dialog-head"><button class="close" id="closeDialog" aria-label="关闭">×</button><h2 id="dialogTitle">统一讲评</h2><p id="dialogSub">把每一处错误还原成现场动作。</p></div>
    <div class="dialog-body"><div class="score-callout"><b id="finalScore">0 / 12</b><span id="finalText">继续练习，直到能在现场一眼识别。</span></div><div class="answers" id="answers"></div><div class="source" id="sourceText"></div></div>
  </dialog>
  <script>
    const scenes=[
      {id:'use',name:'场景一：使用过程找茬',image:'assets/人字梯错误作业场景_v0.3.png',alt:'工厂内两名作业人员违规共用人字梯进行高处维修的找茬场景',task:'任务：找出图中的 12 处不安全行为或状态',sub:'重点看人员动作、梯子状态、地面环境和作业区域。',source:'判定口径依据：项目《人字梯要求与引用源总览》，重点对应单人单侧、完全展开与撑杆锁定、禁站顶部、三点接触、面向梯子、坚实平整防滑地面及使用前检查。当前为课程最小样品；涉及客户内部口径的冲突项，进入正式教材前仍需确认。',issues:[
        {id:1,x:44.7,y:40.8,r:4.4,title:'站在梯子顶部平台',desc:'双脚明确踩在顶部平台，人员重心已经高于梯架的稳定控制范围。',fix:'正确做法：禁止站在顶部平台和禁站踏级；高度不够就更换合适的作业平台。'},
        {id:2,x:45.2,y:20.8,r:6.0,title:'身体过度侧向探出',desc:'躯干明显越过梯框，钻孔反作用力会进一步把梯子向侧面拉翻。',fix:'正确做法：肚脐保持在两梯框之间；够不到就下梯重新定位。'},
        {id:3,x:54.8,y:8.5,r:5.0,title:'双手作业，失去三点接触',desc:'两只手都在操作电钻，人与梯子之间没有稳定的三点接触。',fix:'正确做法：上下梯保持三点接触；需要双手持续用力的作业应改用合适的作业平台。'},
        {id:4,x:53.8,y:51.0,r:7.0,title:'两人同时使用同一把人字梯',desc:'两人的载荷和动作互相干扰，梯体可能突然偏移或失稳。',fix:'正确做法：一把人字梯同一时间只允许一人使用。'},
        {id:5,x:55.4,y:70.5,r:5.3,title:'攀爬人字梯支撑侧',desc:'第二人站在人字梯背面支撑侧，踏面和抓握条件不适合作为攀登面。',fix:'正确做法：只从设计的攀登面上下，并始终面向梯子。'},
        {id:6,x:51.3,y:62.0,r:4.6,title:'撑杆没有完全展开锁定',desc:'右侧撑杆呈斜垂状态，没有形成可靠的展开锁定。',fix:'正确做法：四脚落地后完全展开梯子，逐侧确认撑杆和铰链锁定到位。'},
        {id:7,x:35.8,y:87.0,r:4.8,title:'用松散砖块垫高梯脚',desc:'砖块可能滑移、碎裂或倾倒，梯子会瞬间失去平衡。',fix:'正确做法：梯子必须直接放在坚实、平整地面；不得用砖块临时找平或加高。'},
        {id:8,x:56.5,y:88.7,r:4.2,title:'防滑梯脚缺失',desc:'右前梯脚露出空心金属管口，缺少橡胶防滑脚套。',fix:'正确做法：使用前检查四个防滑脚套，缺失或磨损立即停用。'},
        {id:9,x:64.0,y:89.2,r:7.0,title:'在积水湿滑地面架梯',desc:'积水会显著降低梯脚摩擦力，人员动作时梯脚容易滑移。',fix:'正确做法：先清理积水并确认地面干燥、防滑，再架设梯子。'},
        {id:10,x:39.1,y:68.0,r:4.0,title:'梯框与踏棍存在临时绑扎修补',desc:'攀登侧中部可以看到黑色绑扎带，说明梯框或踏棍曾以非原厂方式临时处理，结构可靠性无法保证。',fix:'正确做法：不得用胶带、铁丝等临时修补承力部件；发现异常立即停用并由专业人员鉴定、维修或报废。'},
        {id:11,x:46.3,y:40.0,r:3.6,title:'工具放在梯顶且未防坠',desc:'扳手松放在顶部平台，可能被碰落，击中下方人员。',fix:'正确做法：工具装入工具袋或使用工具防坠绳，不得散放在梯顶。'},
        {id:12,x:33.0,y:66.5,r:6.0,title:'作业区未隔离，人员从下方经过',desc:'有人直接穿过高处作业影响区，存在坠物打击风险。',fix:'正确做法：设置围栏或警戒线，禁止无关人员进入和从下方通行。'}
      ]},
      {id:'structure',name:'人字梯：搭设与检查参数',image:'assets/人字梯结构参数错误场景_v0.1.png',alt:'工厂内一把人字梯的关键参数与使用前检查判断场景',task:'任务：判断 12 个搭设与检查参数牌，点出其中 6 个错误参数',sub:'蓝色参数牌里有正确也有错误；重点判断高度、角度、承重、踏步、锁定、防滑和管控口径。',source:'判定口径依据：GB 12142-2007《便携式金属梯安全要求》（现行）、GB 12142-2025《便携式金属梯安全要求》（2027-01-01 实施）、GB/T 17889.4-2024《梯子 第4部分：铰链梯》、GB/T 17889.3-2024《梯子 第3部分：使用信息》、JGJ 80-2016 §5.1.6、AQ 3025-2008、GB 3608-2025，以及项目内贝卡尔特高处作业守则、F01 表单 A05/B-高处作业、GAMM 登高设施移动梯具检查要求。当前为训练样品：正式教材前需把客户表单中“天板/最上两级/最上三级”等冲突口径与徐工确认。',issues:[
        {id:1,isError:false,x:58,y:40,lx:76,ly:30,r:6.2,label:'梯长 0.9~6m：合格范围',title:'正确参数：人字梯梯长 0.9~6m',desc:'自立梯/人字梯长度控制在 0.9~6m 是 GB 12142 新旧口径一致的核心产品参数。',fix:'正确做法：使用前先看铭牌和实物规格；超过适用高度或需要长时间作业时，改用平台、脚手架或 MEWP。'},
        {id:2,isError:true,x:58.8,y:58.5,lx:77,ly:43,r:6.2,label:'承重 ≥80kg：可放行',title:'错误参数：承重阈值写低了',desc:'GB 12142-2025 要求额定承重量 ≥100kg，GAMM/GB/T 17889.2 又常用 150kg 总载荷口径；写成 80kg 会误放行低承载梯具。',fix:'正确做法：核对梯上最大承重标识，人体加工具不得超过额定载荷；无标识或低于要求即停用。'},
        {id:3,isError:false,x:61,y:85.5,lx:51,ly:90,r:6.2,label:'上部夹角 35°~45°：合格',title:'正确参数：上部夹角 35°~45°',desc:'AQ 3025 的现场操作口径为折梯上部夹角 35°~45°，与 GB 12142 梯框倾角口径可换算，不冲突。',fix:'正确做法：人字梯完全展开后确认角度合适、撑杆/锁定件到位，不能半开使用。'},
        {id:4,isError:true,x:57.7,y:60,lx:78,ly:58,r:6.2,label:'撑杆未锁：可短时用',title:'错误参数：撑杆未锁仍允许使用',desc:'撑杆或锁定装置不到位时，人字梯没有形成稳定三角结构，短时使用也可能突然合拢或失稳。',fix:'正确做法：使用前完全展开，确认天板/铰链/撑杆/拉杆全部锁定到位。'},
        {id:5,isError:true,x:42.4,y:50.2,lx:22,ly:46,r:6.2,label:'踏步间距 ≤400mm：按国标验收',title:'错误参数：把厂内目视值当国标验收值',desc:'GAMM 的“踏步间距≤40cm”是现场简化检查口径；GB 12142-2025 对踏棍/踏板间距为 230~308mm 且等间距、公差 ±2mm。',fix:'正确做法：现场快速筛查可用厂内口径，产品验收和标准图参数应写国标 230~308mm。'},
        {id:6,isError:false,x:54.7,y:7.4,lx:35,ly:14,r:6.2,label:'顶部内宽 ≥280mm',title:'正确参数：顶部内宽 ≥280mm',desc:'GB 12142 对自立梯顶部踏棍处两梯框内侧净宽提出 ≥280mm 的产品尺寸要求。',fix:'正确做法：采购/验收看产品参数；现场使用前重点确认梯框无变形，顶部结构没有缩窄、开裂或松动。'},
        {id:7,isError:true,x:54.7,y:7.4,lx:34,ly:25,r:6.2,label:'顶部扶手 ≥300mm',title:'错误参数：顶部扶手高度不足',desc:'当顶部工作面允许踩踏时，GB 12142-2025 要求距顶部工作面垂直高度 ≥450mm 的扶手或同等功能构件。300mm 不能作为合格参数。',fix:'正确做法：顶部可踩踏的平台式人字梯，应检查扶手高度、完整性和固定可靠性；普通人字梯顶部不得站人。'},
        {id:8,isError:false,x:66.7,y:18.2,lx:82,ly:18,r:6.2,label:'铰链全锁定：必查',title:'正确参数：铰链必须全部锁定',desc:'铰链梯使用中所有铰链必须处于锁定状态；连接件、销轴、铆钉缺失或卡滞都不能放行。',fix:'正确做法：逐个检查铰链、锁销、撑杆和连接件，确认无缺失、无松动、动作灵活且锁定可靠。'},
        {id:9,isError:true,x:33,y:89.6,lx:18,ly:82,r:6.2,label:'四脚着地，可垫砖找平',title:'错误参数：允许垫砖找平',desc:'人字梯必须放在坚固、平坦、水平支撑面上，四脚同时着地；垫砖、垫木箱会引入滑移和倾覆风险。',fix:'正确做法：地面不平就换位置或换设备，不得用临时垫物获得附加高度或找平。'},
        {id:10,isError:true,x:78.7,y:85,lx:88,ly:88,r:6.2,label:'缺防滑脚：可包胶带',title:'错误参数：胶带替代防滑梯脚',desc:'防滑梯脚/防滑垫缺失、老化或磨损会降低摩擦力，胶带不是原厂防滑件，不能替代。',fix:'正确做法：四个防滑脚应齐全完好；缺失、过度磨损或老化时停用，更换合格配件后再使用。'},
        {id:11,isError:false,x:68,y:38,lx:85,ly:42,r:6.2,label:'1.5m 坠落风险：走 PTW',title:'正确参数：贝卡尔特 1.5m 起从严管控',desc:'GB 3608 以 2m 及以上定义高处作业；但项目内 PTW/表单口径对 1.5m 坠落风险更早介入，属于企业从严要求。',fix:'正确做法：培训中要讲清“国标 2m 是法定分级，企业 1.5m 是从严管控”，现场按更严口径执行。'},
        {id:12,isError:true,x:50,y:12,lx:64,ly:12,r:6.2,label:'最上两级可站人',title:'错误参数：站位禁区被放宽',desc:'项目整理稿提示这里存在客户表单冲突：守则更严，要求最上三级禁站；国标也要求不得高于最高站立面。写成“最上两级可站人”会误导学员。',fix:'正确做法：普通人字梯顶部、顶帽和禁站踏级不得站人；正式课件需与客户确认“最上两级/最上三级/天板”最终口径。'}
      ]},
      {id:'scaffold_setup',name:'脚手架：搭设与检查',image:'assets/移动式门式脚手架_搭设检查找茬_v0.1.png',alt:'移动式门式脚手架搭设与使用前检查找茬场景',task:'任务：根据图中标注的 12 个搭设与检查参数，判断哪些参数不能放行',sub:'图上只给参数事实，不提前告诉正确或错误；点击参数后再看判断结果。',source:'判定口径参考：JGJ/T 128-2019《建筑施工门式钢管脚手架安全技术标准》、移动式门式脚手架常见安全检查要求及企业从严管理口径。当前为训练样品，正式教材前需结合客户标准、设备厂家说明书和现场实物再校准。',issues:[
        {id:1,isError:false,x:42,y:14,lx:24,ly:16,r:6,label:'上栏杆高度 1.2m',title:'正确参数：上部防护栏杆高度口径正确',desc:'作业平台周边设置上栏杆，是防止人员从平台边缘坠落的核心防护。按从严口径，上杆宜按约 1.2m 控制。',fix:'正确做法：确认平台四周上栏杆连续、牢固、无开口，不能只看“有没有一根杆”。'},
        {id:2,isError:true,x:51,y:22,lx:47,ly:18,r:6,label:'平台堆料约 0.8m 高',title:'错误参数：集中堆料被放行',desc:'材料和工具集中放在平台一侧，会造成局部超载、重心偏移，也增加坠物风险。',fix:'正确做法：平台材料应少量、均匀、分散放置，并核对施工荷载。'},
        {id:3,isError:true,x:55,y:33,lx:73,ly:30,r:5,label:'挡脚板高度 50mm',title:'错误参数：挡脚板高度过低',desc:'50mm 挡边只属于部分内部简化口径，按移动操作平台/临边防护从严口径，挡脚板应按 ≥180mm 控制更稳。',fix:'正确做法：作业层边缘设置连续、固定牢靠的挡脚板，防止工具和材料滑落。'},
        {id:4,isError:false,x:45,y:66,lx:25,ly:58,r:5,label:'状态牌位置：入口侧',title:'正确参数：搭设后应验收挂牌',desc:'移动式门式脚手架搭设完成、移动后或改动后，应有检查确认和状态标识，避免未经确认就使用。',fix:'正确做法：挂出“可使用/禁止使用”等状态牌，状态不清时不得上架。'},
        {id:5,isError:true,x:49,y:63,lx:30,ly:70,r:6,label:'平台板缝隙约 120mm',title:'错误参数：平台未满铺仍可作业',desc:'平台板未满铺或固定不牢时，人员踩踏可能移位、翘起或踩空。',fix:'正确做法：脚手板应满铺、平整、固定牢靠，发现松动、缺板立即停用整改。'},
        {id:6,isError:false,x:63,y:48,lx:80,ly:45,r:6,label:'剪刀撑角度 45°~60°',title:'正确参数：剪刀撑角度口径正确',desc:'竖向剪刀撑按 45°~60° 设置，有利于形成整体稳定的空间结构。',fix:'正确做法：检查剪刀撑连续设置、角度合适、连接牢固，不得随意拆除。'},
        {id:7,isError:true,x:75,y:55,lx:83,ly:62,r:6,label:'侧面加固杆间距 4.5m',title:'错误参数：侧面加固杆缺失被放行',desc:'侧面加固杆缺失或间距过大，会削弱架体抗侧向变形能力。',fix:'正确做法：外侧周边和内部纵横向加固杆应连续设置，并检查扣件、插销有效。'},
        {id:8,isError:false,x:58,y:60,lx:76,ly:72,r:5,label:'插销锁定点 4 处',title:'正确参数：连接件和插销必须逐个锁定',desc:'门架、横杆、斜撑等节点依赖连接件和插销传力，任何缺失或松脱都可能导致局部失效。',fix:'正确做法：逐个检查连接件、锁臂、插销和扣件，确认到位、无缺失、无松脱。'},
        {id:9,isError:true,x:48,y:90,lx:50,ly:83,r:5,label:'脚轮制动 2/4 已锁',title:'错误参数：脚轮未锁仍允许使用',desc:'脚轮未制动时，人员上架或平台受力后，架体可能突然移动。',fix:'正确做法：使用前全部脚轮落地并锁定，确认锁定后架体不应滑动。'},
        {id:10,isError:true,x:35,y:91,lx:20,ly:88,r:5,label:'脚轮垫高 80mm',title:'错误参数：允许用垫块找平',desc:'脚轮或支腿落在垫块、杂物或不平整区域上，支承点容易滑移或倾斜。',fix:'正确做法：脚轮应落在坚实、平整、无积水地面；不得用临时垫块凑合找平。'},
        {id:11,isError:false,x:50,y:45,lx:24,ly:40,r:7,label:'高宽比 H/B=2:1',title:'正确参数：高宽比控制口径正确',desc:'移动操作平台或移动门式脚手架需要控制架体高度与底部宽度关系，防止高而窄导致倾覆。',fix:'正确做法：按方案控制高度和高宽比，必要时设置外撑、连墙或其他防倾覆措施。'},
        {id:12,isError:true,x:73,y:89,lx:84,ly:84,r:5,label:'外撑离地 60mm',title:'错误参数：外撑未落地被放行',desc:'外撑/支腿角度、落地点或防滑措施不到位，无法真正承担防倾覆作用。',fix:'正确做法：外撑应按规定角度展开，底部防滑、落地可靠，移动或调整后重新检查。'}
      ]},
      {id:'scaffold_use',name:'脚手架：使用过程',image:'assets/移动式门式脚手架_使用过程找茬_v0.1.png',alt:'移动式门式脚手架使用过程找茬场景',task:'任务：找出移动式门式脚手架使用过程中的 12 处不安全行为',sub:'重点看人在不在平台、能不能移动、是否攀爬外侧、有没有超载、坠物和隔离。',source:'判定口径参考：移动式门式脚手架使用过程安全要求、JGJ/T 128-2019 相关构造与使用要求，以及企业“移动时空载、无人、脚轮锁定、禁止攀爬外侧、禁止借架体支撑管线设备”的从严管理口径。当前为训练样品，正式教材前需结合客户标准和现场实物再校准。',issues:[
        {id:1,x:68,y:12,r:6,title:'人员探出护栏外作业',desc:'人员身体越过护栏外侧去够管线，重心已经离开平台安全范围，存在坠落风险。',fix:'正确做法：人员应始终在护栏内作业，够不到就调整平台位置或换合适设备。'},
        {id:2,x:37,y:16,r:6,title:'平台材料集中堆放',desc:'材料集中堆在平台上，既可能超过施工荷载，也会占用人员站位和通道。',fix:'正确做法：材料只保留本次作业所需数量，均匀放置，不得集中堆放或超载。'},
        {id:3,x:56,y:25,r:5,title:'工具临边散放，存在坠物风险',desc:'工具和小件材料靠近平台边缘，人员碰撞后容易掉落伤人。',fix:'正确做法：工具放入工具包、工具箱或采取防坠措施，平台边缘不得散放物件。'},
        {id:4,x:28,y:43,r:7,title:'攀爬架体外侧或交叉支撑',desc:'人员从外侧架体、斜撑攀爬，脚踩和手抓都不是设计攀登路径。',fix:'正确做法：只能使用专用爬梯或规定通道上下，不得攀爬门架外侧和剪刀撑。'},
        {id:5,x:75,y:59,r:7,title:'平台有人时移动脚手架',desc:'架上有人仍推动脚手架，遇到地面不平、障碍物或急停时容易造成坠落。',fix:'正确做法：移动前人员全部下架，工具材料清走或固定，移动到位并锁轮后再上人作业。'},
        {id:6,x:75,y:39,r:6,title:'借脚手架支撑管线或设施',desc:'把脚手架当作管线、设备或临时支撑，会引入额外水平力和不可控载荷。',fix:'正确做法：脚手架只作为作业平台使用，不得作为管线、设备、模板或其他设施支撑。'},
        {id:7,x:62,y:25,r:5,title:'护栏开口或缺失',desc:'平台局部护栏不完整，人员转身、搬运或探身时容易从开口处坠落。',fix:'正确做法：平台周边护栏、中栏杆、挡脚板应完整；有开口必须封闭或停止使用。'},
        {id:8,x:52,y:50,r:6,title:'剪刀撑被拆除或松脱',desc:'剪刀撑缺失会削弱架体整体稳定性，使用中架体可能摇晃、变形。',fix:'正确做法：使用期间不得拆除剪刀撑、加固杆、护栏等构件；缺失立即停用整改。'},
        {id:9,x:51,y:91,r:5,title:'移动路径有积水湿滑',desc:'脚轮经过积水区域时摩擦力下降，可能打滑、偏移或突然卡住。',fix:'正确做法：移动和使用前清理路线，确认地面平整、坚实、无积水。'},
        {id:10,x:70,y:83,r:5,title:'移动路径有障碍物',desc:'脚轮撞到障碍物会使架体急停或倾斜，架上人员和物料容易失稳。',fix:'正确做法：移动前清除地面障碍，安排人员观察路线，缓慢匀速移动。'},
        {id:11,x:19,y:63,r:6,title:'下方未设置隔离区',desc:'作业下方有人通行或停留，一旦工具、材料坠落会造成打击伤害。',fix:'正确做法：作业影响范围设置警戒线或围挡，禁止无关人员进入。'},
        {id:12,x:45,y:87,r:5,title:'脚轮制动未确认',desc:'脚轮没有全部锁定或锁定状态未确认，平台受力后可能滑移。',fix:'正确做法：到位后逐个锁定脚轮，确认脚轮有效制动后方可上人作业。'}
      ]},
      {id:'boom_select',name:'曲臂车：选用与入场参数',image:'assets/曲臂登高车_选用入场参数找茬_v0.1.png',alt:'曲臂式高空作业平台选用与入场参数判断场景',task:'任务：根据图中标注的 12 个选用与入场参数，判断哪些参数不能放行',sub:'图上只给参数事实，不提前告诉正确或错误；点击参数后再看判断结果。',source:'判定口径参考：GB/T 25849、GB 40160、GB/T 39747、高空作业平台/曲臂车制造商说明书，以及项目内曲臂登高车检查与高处作业管理口径。当前为训练样品，正式教材前需按客户设备型号、厂家手册和现场标准校准。',issues:[
        {id:1,isError:true,x:56,y:30,lx:24,ly:16,r:6,label:'平台额定载荷 230kg',title:'错误参数：额定载荷不足以覆盖本次载荷',desc:'如果人员、工具和材料总重量已经超过平台额定载荷，设备不能用于本次作业。',fix:'正确做法：选型时核对平台额定载荷 ≥ 人员 + 工具 + 材料总重量，并留有安全余量。'},
        {id:2,isError:true,x:82,y:24,lx:75,ly:14,r:6,label:'人员+工具+材料 260kg',title:'错误参数：实际载荷超过额定载荷',desc:'平台额定载荷 230kg，而本次总载荷 260kg，已经超载。',fix:'正确做法：减少工具材料、换更高额定载荷设备，或调整作业方案；超载不得放行。'},
        {id:3,isError:false,x:40,y:66,lx:18,ly:34,r:6,label:'作业高度 14m',title:'正确参数：作业高度在设备能力内',desc:'作业高度本身不是问题，但必须同时核对水平作业半径、载荷和地面条件。',fix:'正确做法：按设备载荷曲线确认高度与半径组合，而不是只看最大高度。'},
        {id:4,isError:true,x:55,y:36,lx:35,ly:26,r:6,label:'水平作业半径 7m',title:'错误参数：未核对载荷曲线的水平半径',desc:'曲臂车能力不仅看高度，还看平台载荷与水平伸距组合；半径过大可能超出允许工作包络。',fix:'正确做法：查制造商载荷曲线，确认当前高度、半径、载荷组合在允许范围内。'},
        {id:5,isError:false,x:88,y:48,lx:78,ly:42,r:6,label:'近电距离 6m',title:'正确参数：近电距离具备安全余量',desc:'与带电体保持足够距离是曲臂车选用和布置的关键前提。',fix:'正确做法：按电压等级和企业要求确认最小安全距离，不足时停工、隔离或断电。'},
        {id:6,isError:true,x:43,y:88,lx:20,ly:60,r:6,label:'地面坡度 6°',title:'错误参数：地面坡度过大',desc:'超过设备允许坡度会影响稳定性，升高平台后倾覆风险显著增加。',fix:'正确做法：查看设备允许坡度/倾斜报警设定，超限位置不得升降作业。'},
        {id:7,isError:false,x:79,y:29,lx:78,ly:60,r:6,label:'平台护栏 1.1m',title:'正确参数：平台护栏高度符合常见要求',desc:'平台护栏是曲臂车平台内的集体防护，1.1m 属常见合格口径。',fix:'正确做法：还要检查护栏无变形、裂纹、锈蚀、开口和门锁异常。'},
        {id:8,isError:true,x:78,y:35,lx:78,ly:72,r:6,label:'踢脚板 50mm',title:'错误参数：踢脚板高度不足',desc:'踢脚板过低时，工具和小件材料更容易从平台边缘滑落。',fix:'正确做法：按设备标准和厂家要求检查踢脚板完整、连续、有效；不足或损坏不得放行。'},
        {id:9,isError:false,x:77,y:50,lx:57,ly:72,r:6,label:'防坠挂点 16kN',title:'正确参数：防坠挂点强度口径正确',desc:'曲臂车平台应设置专用防坠挂点，人员安全带应挂在指定挂点。',fix:'正确做法：确认挂点标识、数量、位置和强度，禁止挂在护栏或管线上。'},
        {id:10,isError:true,x:35,y:85,lx:36,ly:87,r:6,label:'轮胎裂纹 25mm',title:'错误参数：轮胎存在明显缺陷',desc:'轮胎裂纹、鼓包、严重磨损或胎压异常会影响设备稳定和行驶安全。',fix:'正确做法：入场前检查轮胎/轮毂状态，缺陷未修复不得进场使用。'},
        {id:11,isError:true,x:43,y:64,lx:20,ly:78,r:6,label:'铭牌载荷模糊',title:'错误参数：铭牌信息不可识读',desc:'铭牌、检验标识或额定载荷看不清时，现场无法确认设备能力和合规状态。',fix:'正确做法：铭牌、检验、警示标识必须清晰；缺失或不可识读时停用核查。'},
        {id:12,isError:false,x:30,y:83,lx:45,ly:92,r:6,label:'风速 8m/s',title:'正确参数：风速处于常见允许范围内',desc:'风速 8m/s 本身通常不是停止作业值，但仍需按厂家和现场要求确认。',fix:'正确做法：持续监测风速；达到厂家或企业停工阈值时立即停止高处作业。'}
      ]},
      {id:'boom_check',name:'曲臂车：使用前检查',image:'assets/曲臂登高车_使用前检查找茬_v0.1.png',alt:'曲臂式高空作业平台使用前检查与功能测试场景',task:'任务：根据图中标注的 12 个使用前检查参数，判断哪些不能放行',sub:'重点看控制测试、报警装置、安全控制、液压电缆、轮胎和防坠挂点。',source:'判定口径参考：曲臂式高空作业平台使用前检查、GB 40160、GB/T 39747、制造商操作手册和项目内高处作业检查口径。当前为训练样品，正式教材前需按设备型号和客户检查表校准。',issues:[
        {id:1,isError:false,x:71,y:43,lx:73,ly:18,r:6,label:'平台急停：可复位',title:'正确参数：平台急停可复位',desc:'平台急停按钮能按下、锁定、复位，是使用前功能测试的基本项。',fix:'正确做法：平台和地面急停都要分别测试，动作异常不得使用。'},
        {id:2,isError:true,x:28,y:38,lx:22,ly:16,r:6,label:'地面急停：无反应',title:'错误参数：地面急停失效',desc:'地面急停是地面人员处置异常的重要控制，失效后不能放行。',fix:'正确做法：地面急停、平台急停均应能立即停止相关动作，失效停用维修。'},
        {id:3,isError:false,x:67,y:43,lx:54,ly:20,r:6,label:'平台控制：动作平稳',title:'正确参数：平台控制动作平稳',desc:'升降、伸缩、回转等动作平稳、准确、无迟滞，是功能测试合格表现。',fix:'正确做法：逐项测试平台控制，松开控制后动作应停止。'},
        {id:4,isError:true,x:31,y:39,lx:35,ly:30,r:6,label:'地面控制：转向延迟',title:'错误参数：地面控制存在延迟',desc:'地面控制动作延迟会影响应急救援和设备精确控制，不能放行。',fix:'正确做法：平台控制和地面控制均应动作准确、无卡滞、无异常延迟。'},
        {id:5,isError:true,x:67,y:31,lx:84,ly:28,r:6,label:'防挤压杆：未复位',title:'错误参数：防挤压装置未复位',desc:'防挤压杆或触发装置未复位，可能导致保护失效或误动作。',fix:'正确做法：检查防挤压装置完好、复位正常，触发后设备按设计停止或反向脱离。'},
        {id:6,isError:true,x:61,y:77,lx:82,ly:42,r:6,label:'安全带挂护栏',title:'错误参数：安全带挂在护栏上',desc:'护栏不是专用防坠挂点，受力方向和强度不能替代厂家设计挂点。',fix:'正确做法：全身式安全带通过短绳或定位绳挂到平台专用挂点。'},
        {id:7,isError:false,x:54,y:72,lx:83,ly:58,r:6,label:'挂点标识 16kN',title:'正确参数：挂点标识清晰',desc:'专用挂点标识清晰，有助于人员正确系挂。',fix:'正确做法：确认挂点无变形、裂纹、缺失；人员不得随意选择护栏系挂。'},
        {id:8,isError:true,x:51,y:26,lx:44,ly:52,r:6,label:'液压接头渗油',title:'错误参数：液压系统渗漏',desc:'液压管路或接头渗油可能导致动作失控、污染地面和火灾风险。',fix:'正确做法：检查阀门、管路、接头无漏油；发现渗漏立即停用维修。'},
        {id:9,isError:true,x:31,y:39,lx:20,ly:55,r:6,label:'电缆护套破损',title:'错误参数：电缆护套破损',desc:'控制电缆护套破损可能造成短路、误动作或触电风险。',fix:'正确做法：检查电缆、接头、护套完整；破损未修复不得使用。'},
        {id:10,isError:false,x:12,y:25,lx:18,ly:72,r:6,label:'警示灯闪烁稳定',title:'正确参数：警示灯工作正常',desc:'警示灯稳定闪烁有助于周边人员识别设备状态和移动风险。',fix:'正确做法：同时测试喇叭、倒车报警和警示灯，任一失效需维修。'},
        {id:11,isError:true,x:64,y:57,lx:57,ly:83,r:6,label:'喇叭无声',title:'错误参数：声响报警失效',desc:'喇叭或倒车报警无声，会降低现场人员对设备动作的预警。',fix:'正确做法：使用前测试喇叭、倒车报警、倾斜报警等声光报警功能。'},
        {id:12,isError:true,x:31,y:78,lx:35,ly:88,r:6,label:'轮胎胎压不足',title:'错误参数：轮胎状态异常',desc:'胎压不足或轮胎损伤会影响稳定性、行驶控制和制动表现。',fix:'正确做法：检查轮胎、轮毂、螺母和胎压/实心胎状态，异常不得放行。'}
      ]}
    ];
    const stage=document.querySelector('#stage'),img=document.querySelector('#sceneImage'),tabs=document.querySelector('.tabs'),foundEl=document.querySelector('#found'),totalEl=document.querySelector('#total'),attemptsEl=document.querySelector('#attempts'),clockEl=document.querySelector('#clock'),progress=document.querySelector('#progress'),toast=document.querySelector('#toast'),dialog=document.querySelector('#answerDialog'),answers=document.querySelector('#answers'),feedback=document.querySelector('#feedbackCard');
    const state={};let current=scenes[0],hints=3,timer,timerStarted=false,started=Date.now();scenes.forEach(s=>state[s.id]={found:new Set(),attempts:0,seconds:0});
    function sceneState(){return state[current.id]}function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function startTimer(){if(timerStarted)return;timerStarted=true;started=Date.now()-sceneState().seconds*1000;timer=setInterval(()=>{sceneState().seconds=Math.floor((Date.now()-started)/1000);clockEl.textContent=formatTime(sceneState().seconds)},1000)}
    function wrongItems(){return current.issues.filter(i=>i.isError!==false)}function say(msg,type=''){toast.textContent=msg;toast.className=`toast show ${type}`;clearTimeout(say.t);say.t=setTimeout(()=>toast.className='toast',1450)}function explain(i){feedback.className='feedback-card show';document.querySelector('#feedbackIcon').textContent='✓';document.querySelector('#feedbackTitle').textContent=`错误 ${i.id}｜${i.title}`;document.querySelector('#feedbackWhy').textContent=`为什么危险：${i.desc}`;document.querySelector('#feedbackDo').textContent=i.fix;feedback.scrollIntoView({behavior:'smooth',block:'nearest'})}function explainCorrect(i){feedback.className='feedback-card show';document.querySelector('#feedbackIcon').textContent='✓';document.querySelector('#feedbackTitle').textContent=`正确参数 ${i.id}｜${i.title}`;document.querySelector('#feedbackWhy').textContent=`为什么正确：${i.desc}`;document.querySelector('#feedbackDo').textContent=i.fix;feedback.scrollIntoView({behavior:'smooth',block:'nearest'})}function explainMiss(){feedback.className='feedback-card show wrong';document.querySelector('#feedbackIcon').textContent='×';document.querySelector('#feedbackTitle').textContent='这里不是预设错误点';document.querySelector('#feedbackWhy').textContent='再按“人—梯—地面—区域”或“铭牌—铰链—撑杆—踏板—脚垫”重新观察。';document.querySelector('#feedbackDo').textContent='提示：第二场景只有错误参数牌计分，正确参数不计入错误得分。'}
    function addMarker(i,answer=false){if(stage.querySelector(`[data-id="${current.id}-${i.id}"]`))return;const m=document.createElement('span');m.className=answer?'marker answer':'marker';m.dataset.id=`${current.id}-${i.id}`;m.dataset.label=i.id;m.style.left=i.x+'%';m.style.top=i.y+'%';if(answer){m.style.background='#e4493fe6';m.style.boxShadow='0 0 0 5px #e4493f55,0 8px 20px #081f3a66';m.style.fontSize='.86rem';m.style.pointerEvents='none'}stage.append(m)}
    function renderParamLabels(){if(!['structure','scaffold_setup','boom_select','boom_check'].includes(current.id))return;current.issues.forEach(i=>{const label=document.createElement('button');label.className='param-label';label.type='button';label.dataset.param=`${current.id}-${i.id}`;label.style.left=(i.lx||i.x)+'%';label.style.top=(i.ly||i.y)+'%';label.textContent=i.label;stage.append(label)})}
    function update(){const s=sceneState(),total=wrongItems().length;foundEl.textContent=s.found.size;totalEl.textContent=total;attemptsEl.textContent=s.attempts;clockEl.textContent=formatTime(s.seconds);progress.style.width=(s.found.size/total*100)+'%';if(s.found.size===total){clearInterval(timer);timerStarted=false;setTimeout(()=>openAnswers(false),450)}}
    function renderTabs(){tabs.innerHTML=scenes.map(s=>`<button class="tab ${s.id===current.id?'active':''}" type="button" data-scene="${s.id}">${s.name}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchScene(b.dataset.scene))}
    function switchScene(id){clearInterval(timer);timerStarted=false;current=scenes.find(s=>s.id===id);hints=3;stage.querySelectorAll('.marker,.miss,.param-label').forEach(n=>n.remove());feedback.className='feedback-card';img.src=current.image;img.alt=current.alt;document.querySelector('#missionText').firstChild.nodeValue=current.task;document.querySelector('#missionSub').textContent=current.sub;document.querySelector('#hintBtn').textContent='给我一个区域提示（3）';renderTabs();renderParamLabels();current.issues.forEach(i=>{if(sceneState().found.has(i.id))addMarker(i)});update();say(`已切换：${current.name}`)}
    stage.addEventListener('click',e=>{startTimer();const rect=stage.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100,s=sceneState();s.attempts++;let hit=current.issues.map(i=>{const defect=Math.hypot((x-i.x)/1.777,y-i.y),label=Number.isFinite(i.lx)?Math.hypot((x-i.lx)/1.777,y-i.ly):defect;return {...i,d:Math.min(defect,label)}}).filter(i=>i.d<=i.r).sort((a,b)=>a.d-b.d)[0];if(hit&&hit.isError===false){explainCorrect(hit);say('这是正确选项，你选对了','ok')}else if(hit){const isNew=!s.found.has(hit.id);s.found.add(hit.id);addMarker(hit);explain(hit);say(isNew?`选对了，这是错误项：${hit.title}`:`这个错误已经找到：${hit.title}`,'ok')}else{const m=document.createElement('span');m.className='miss';m.style.left=x+'%';m.style.top=y+'%';stage.append(m);setTimeout(()=>m.remove(),800);explainMiss();say('这里不是预设选项','no')}update()});
    function answerType(i){if(['structure','scaffold_setup','boom_select','boom_check'].includes(current.id))return i.isError===false?'正确参数':'错误参数';return '错误点'}
    function finalAdvice(found,total){if(['structure','scaffold_setup','boom_select','boom_check'].includes(current.id)){return found>=total?'错误参数识别完成；再复盘正确参数为什么能成立。':found>=Math.ceil(total*0.6)?'基础判断不错；重点复盘漏掉的错误参数。':'先区分“合格参数”和“放行错误参数”，再练一次。'}return found>=total?'本场景错误点已全部找出；讲评时重点转成现场检查动作。':found>=Math.ceil(total*0.6)?'基础判断不错；继续复盘漏掉的高风险点。':'先按“人、设备、地面、区域隔离”四类重新观察。'}
    function openAnswers(teacher){const s=sceneState(),total=wrongItems().length;if(!teacher&&s.attempts===0){say('请先观察并点击，再提交讲评');return}wrongItems().forEach(i=>addMarker(i,true));answers.innerHTML=current.issues.map(i=>`<article class="answer ${s.found.has(i.id)||i.isError===false?'found':''}"><span class="n">${i.id}</span><div><h3>${answerType(i)}｜${i.title}${s.found.has(i.id)?' · 已找到':''}</h3><p>${i.desc}</p><p style="margin-top:5px;color:#0a6849;font-weight:750">${i.fix}</p></div></article>`).join('');document.querySelector('#dialogTitle').textContent=`统一讲评｜${current.name}`;document.querySelector('#dialogSub').textContent=current.sub;document.querySelector('#finalScore').textContent=`${s.found.size} / ${total}`;document.querySelector('#finalText').textContent=finalAdvice(s.found.size,total);document.querySelector('#sourceText').textContent=current.source;dialog.showModal()}
    document.querySelector('#submitBtn').onclick=()=>openAnswers(false);document.querySelector('#teacherBtn').onclick=()=>openAnswers(true);document.querySelector('#closeDialog').onclick=()=>dialog.close();document.querySelector('#feedbackClose').onclick=()=>feedback.className='feedback-card';dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    document.querySelector('#hintBtn').onclick=()=>{startTimer();if(!hints)return say('提示已用完');const unseen=wrongItems().filter(i=>!sceneState().found.has(i.id));if(!unseen.length)return say('已经全部找到了','ok');const i=unseen[Math.floor(Math.random()*unseen.length)];hints--;document.querySelector('#hintBtn').textContent=`给我一个区域提示（${hints}）`;const pulse=document.createElement('span');pulse.className='marker';pulse.style.left=(i.lx||i.x)+'%';pulse.style.top=(i.ly||i.y)+'%';pulse.style.background='transparent';pulse.style.borderColor='#ffd23f';pulse.style.boxShadow='0 0 0 7px #ffd23f66';pulse.style.animation='pop .3s ease,miss 1.8s .3s ease forwards';stage.append(pulse);setTimeout(()=>pulse.remove(),2100);say('黄色圈只提示区域，不算已找到')};
    document.querySelector('#resetBtn').onclick=()=>{clearInterval(timer);timerStarted=false;state[current.id]={found:new Set(),attempts:0,seconds:0};hints=3;feedback.className='feedback-card';stage.querySelectorAll('.marker,.miss').forEach(n=>n.remove());document.querySelector('#hintBtn').textContent='给我一个区域提示（3）';update();say('已重新开始本场景')};
    renderTabs();switchScene('use');
  </script>
