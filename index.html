<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta name="description" content="登高作业安全调查与互动找茬训练：人字梯、移动式门式脚手架">
  <title>登高作业安全调查｜互动训练</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a2342'/%3E%3Cpath d='M18 52 29 12h6l11 40M22 39h20M25 29h14M27 20h10' fill='none' stroke='%23ffd23f' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#091c31;--navy:#0a2342;--cyan:#36c5f0;--yellow:#ffd23f;--red:#e4493f;--green:#08a66c;--paper:#f4f7fa;--muted:#617286;--line:#d8e2ec;--shadow:0 18px 50px rgba(8,30,55,.16)}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}button{font:inherit}
    .topbar{background:var(--navy);color:#fff;padding:14px clamp(16px,3vw,38px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;border-bottom:5px solid var(--yellow)}
    .brand{display:flex;align-items:center;gap:12px}.badge{width:44px;height:44px;border-radius:12px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:950;font-size:1.45rem;transform:rotate(-3deg)}
    h1{font-size:clamp(1.08rem,2.3vw,1.65rem);line-height:1.2;margin:0}.sub{margin:4px 0 0;color:#c7d8e9;font-size:.88rem}
    .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:94px;background:#ffffff12;border:1px solid #ffffff25;border-radius:12px;padding:8px 12px;text-align:center}.stat strong{display:block;color:var(--yellow);font-size:1.12rem}.stat span{font-size:.74rem;color:#d8e5f2}
    main{width:min(1480px,100%);margin:auto;padding:18px clamp(12px,2.2vw,30px) 30px}.mission{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:13px}.mission p{margin:0;font-weight:800;font-size:clamp(.95rem,1.4vw,1.1rem)}.mission small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:9px 14px;font-weight:850;cursor:pointer}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .qr-entry{display:grid;grid-template-columns:82px 180px;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:0 6px 20px #0a23420f}.qr-entry img{width:82px;height:82px;image-rendering:pixelated}.qr-entry b{display:block;font-size:.88rem}.qr-entry span{display:block;color:var(--muted);font-size:.76rem;line-height:1.35;margin-top:3px}
    .progress{height:8px;background:#dfe8f0;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress>span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--yellow));transition:width .35s ease}
    .stage{position:relative;border-radius:18px;overflow:hidden;background:#c9d4df;box-shadow:var(--shadow);border:1px solid #c5d1dc;isolation:isolate;cursor:crosshair;touch-action:manipulation;user-select:none}.stage img{width:100%;height:auto;display:block;pointer-events:none}.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff70}
    .marker{position:absolute;width:clamp(34px,4vw,58px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:4;animation:pop .28s ease both;color:#fff;font-weight:950;background:#08a66cd9;border:3px solid #fff;box-shadow:0 0 0 5px #08a66c66,0 8px 20px #081f3a66}.marker::after{content:"✓"}.marker.answer::after{content:attr(data-label)}
    .param-label{position:absolute;z-index:3;max-width:min(210px,24vw);transform:translate(-50%,-50%);border:2px solid #245a82;background:#f5fbff;color:#0b3150;border-radius:10px;padding:7px 9px;font-size:clamp(.68rem,1vw,.86rem);line-height:1.22;font-weight:900;box-shadow:0 8px 24px #071a2c36;cursor:pointer}.param-label::before{content:"参数";display:inline-block;margin-right:5px;padding:1px 5px;border-radius:999px;background:#245a82;color:#fff;font-size:.68em}.param-label::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:24px;background:#245a82;transform:translateX(-50%)}
    .miss{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;background:#e4493fe6;color:#fff;display:grid;place-items:center;font-weight:950;z-index:5;animation:miss .75s ease forwards;pointer-events:none}.miss::after{content:"×"}@keyframes pop{from{opacity:0;scale:.4}to{opacity:1;scale:1}}@keyframes miss{0%{opacity:0;scale:.4}25%{opacity:1;scale:1}100%{opacity:0;scale:1.45}}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}.btn{border:0;border-radius:11px;padding:11px 17px;font-weight:850;cursor:pointer;min-height:46px;transition:transform .18s,box-shadow .18s,background .18s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--yellow);color:var(--navy);box-shadow:0 8px 20px #ffd23f44}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.danger{background:var(--navy);color:#fff}.hint{background:#e7f7fc;color:#075276}
    .feedback-card{display:none;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;margin-top:14px;padding:14px 16px;border-radius:14px;background:#eefaf4;border:1px solid #9bd8bd;box-shadow:0 8px 24px #082c1b18}.feedback-card.show{display:grid}.feedback-card.wrong{background:#fff3f1;border-color:#efb1aa}.feedback-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:950;font-size:1.15rem}.feedback-card.wrong .feedback-icon{background:var(--red)}.feedback-copy h2{font-size:1rem;margin:0 0 5px}.feedback-copy p{margin:3px 0;font-size:.88rem;line-height:1.5}.feedback-copy .why{color:#91401f}.feedback-copy .do{color:#0a6849;font-weight:750}.feedback-close{border:0;background:transparent;color:var(--muted);font-size:1.25rem;cursor:pointer;padding:0 4px}
    .note{text-align:center;color:var(--muted);font-size:.82rem;margin:12px 0 0}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#071a2c;color:#fff;border-radius:99px;padding:11px 18px;box-shadow:0 10px 35px #0005;transition:.25s;pointer-events:none;max-width:calc(100vw - 24px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:var(--green)}.toast.no{background:var(--red)}
    dialog{border:0;padding:0;border-radius:18px;width:min(920px,calc(100% - 24px));max-height:88vh;box-shadow:0 30px 90px #00152a66;color:var(--ink)}dialog::backdrop{background:#06182bd9;backdrop-filter:blur(5px)}.dialog-head{background:var(--navy);color:#fff;padding:22px 24px;position:sticky;top:0;z-index:2}.dialog-head h2{margin:0 40px 5px 0;font-size:1.3rem}.dialog-head p{margin:0;color:#c9d9e8;font-size:.9rem}.close{position:absolute;right:16px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff12;color:#fff;font-size:1.2rem;cursor:pointer}.dialog-body{padding:20px 24px 24px;background:#fff}.score-callout{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #b9d9cb;background:#eefaf4;border-radius:14px;margin-bottom:16px}.score-callout b{font-size:1.5rem;color:var(--green)}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start}.answer .n{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.answer h3{font-size:.95rem;margin:1px 0 4px}.answer p{font-size:.82rem;color:var(--muted);margin:0;line-height:1.5}.answer.found{border-color:#8bd4b5;background:#f1fbf6}.answer.found .n{background:var(--green)}.source{margin:17px 0 0;padding:13px 15px;background:#f3f6f9;border-radius:10px;color:#53677a;font-size:.8rem;line-height:1.55}
    @media(max-width:860px){.topbar,.mission{grid-template-columns:1fr}.stats{justify-content:flex-start}.stat{flex:1}.answers{grid-template-columns:1fr}.stage{border-radius:12px}.sub{display:none}.qr-entry{grid-template-columns:72px 1fr}.qr-entry img{width:72px;height:72px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="badge">查</div><div><h1>登高作业安全调查｜互动训练</h1><p class="sub">当前包含：人字梯、移动式门式脚手架。后续可继续加入直梯、登高车、曲臂车等设备。</p></div></div>
    <div class="stats" aria-live="polite"><div class="stat"><strong><span id="found">0</span> / <span id="total">12</span></strong><span>已找出</span></div><div class="stat"><strong id="attempts">0</strong><span>点击次数</span></div><div class="stat"><strong id="clock">00:00</strong><span>用时</span></div></div>
  </header>
  <main>
    <section class="mission">
      <p id="missionText">任务：找出图中的 12 处不安全行为或状态<small id="missionSub">命中后立即显示错误、危险和正确做法；最后统一讲评。</small></p>
      <aside class="qr-entry" aria-label="学员扫码登录入口"><img src="assets/学员登录二维码_GitHubPages入口.png" alt="学员扫码登录二维码"><div><b>学员扫码登录</b><span>微信扫码后通过 GitHub Pages 直接进入当前训练页面。</span></div></aside>
    </section>
    <nav class="tabs" aria-label="找茬场景切换"></nav>
    <div class="progress" aria-label="完成进度"><span id="progress"></span></div>
    <section class="stage" id="stage" role="application" aria-label="人字梯找茬场景，点击发现的错误位置"><img id="sceneImage" alt=""></section>
    <aside class="feedback-card" id="feedbackCard" aria-live="polite"><div class="feedback-icon" id="feedbackIcon">✓</div><div class="feedback-copy"><h2 id="feedbackTitle"></h2><p class="why" id="feedbackWhy"></p><p class="do" id="feedbackDo"></p></div><button class="feedback-close" id="feedbackClose" type="button" aria-label="关闭提示">×</button></aside>
    <div class="toolbar">
      <button class="btn hint" id="hintBtn" type="button">给我一个区域提示（3）</button>
      <button class="btn primary" id="submitBtn" type="button">提交并统一讲评</button>
      <button class="btn secondary" id="resetBtn" type="button">重新开始本场景</button>
      <button class="btn danger" id="teacherBtn" type="button">讲师直接揭晓</button>
    </div>
    <p class="note">训练样品 v0.8｜已加入移动式门式脚手架两个场景；图片、参数口径与热点仍需人工校准后再进正式课件。</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="answerDialog">
    <div class="dialog-head"><button class="close" id="closeDialog" aria-label="关闭">×</button><h2 id="dialogTitle">统一讲评</h2><p id="dialogSub">把每一处错误还原成现场动作。</p></div>
    <div class="dialog-body"><div class="score-callout"><b id="finalScore">0 / 12</b><span id="finalText">继续练习，直到能在现场一眼识别。</span></div><div class="answers" id="answers"></div><div class="source" id="sourceText"></div></div>
  </dialog>
  <script>
    const scenes=[
      {id:'use',name:'场景一：使用过程找茬',image:'assets/人字梯错误作业场景_v0.3.png',alt:'工厂内两名作业人员违规共用人字梯进行高处维修的找茬场景',task:'任务：找出图中的 12 处不安全行为或状态',sub:'重点看人员动作、梯子状态、地面环境和作业区域。',source:'判定口径依据：项目《人字梯要求与引用源总览》，重点对应单人单侧、完全展开与撑杆锁定、禁站顶部、三点接触、面向梯子、坚实平整防滑地面及使用前检查。当前为课程最小样品；涉及客户内部口径的冲突项，进入正式教材前仍需确认。',issues:[
        {id:1,x:44.7,y:40.8,r:4.4,title:'站在梯子顶部平台',desc:'双脚明确踩在顶部平台，人员重心已经高于梯架的稳定控制范围。',fix:'正确做法：禁止站在顶部平台和禁站踏级；高度不够就更换合适的作业平台。'},
        {id:2,x:45.2,y:20.8,r:6.0,title:'身体过度侧向探出',desc:'躯干明显越过梯框，钻孔反作用力会进一步把梯子向侧面拉翻。',fix:'正确做法：肚脐保持在两梯框之间；够不到就下梯重新定位。'},
        {id:3,x:54.8,y:8.5,r:5.0,title:'双手作业，失去三点接触',desc:'两只手都在操作电钻，人与梯子之间没有稳定的三点接触。',fix:'正确做法：上下梯保持三点接触；需要双手持续用力的作业应改用合适的作业平台。'},
        {id:4,x:53.8,y:51.0,r:7.0,title:'两人同时使用同一把人字梯',desc:'两人的载荷和动作互相干扰，梯体可能突然偏移或失稳。',fix:'正确做法：一把人字梯同一时间只允许一人使用。'},
        {id:5,x:55.4,y:70.5,r:5.3,title:'攀爬人字梯支撑侧',desc:'第二人站在人字梯背面支撑侧，踏面和抓握条件不适合作为攀登面。',fix:'正确做法：只从设计的攀登面上下，并始终面向梯子。'},
        {id:6,x:51.3,y:62.0,r:4.6,title:'撑杆没有完全展开锁定',desc:'右侧撑杆呈斜垂状态，没有形成可靠的展开锁定。',fix:'正确做法：四脚落地后完全展开梯子，逐侧确认撑杆和铰链锁定到位。'},
        {id:7,x:35.8,y:87.0,r:4.8,title:'用松散砖块垫高梯脚',desc:'砖块可能滑移、碎裂或倾倒，梯子会瞬间失去平衡。',fix:'正确做法：梯子必须直接放在坚实、平整地面；不得用砖块临时找平或加高。'},
        {id:8,x:56.5,y:88.7,r:4.2,title:'防滑梯脚缺失',desc:'右前梯脚露出空心金属管口，缺少橡胶防滑脚套。',fix:'正确做法：使用前检查四个防滑脚套，缺失或磨损立即停用。'},
        {id:9,x:64.0,y:89.2,r:7.0,title:'在积水湿滑地面架梯',desc:'积水会显著降低梯脚摩擦力，人员动作时梯脚容易滑移。',fix:'正确做法：先清理积水并确认地面干燥、防滑，再架设梯子。'},
        {id:10,x:39.1,y:68.0,r:4.0,title:'梯框与踏棍存在临时绑扎修补',desc:'攀登侧中部可以看到黑色绑扎带，说明梯框或踏棍曾以非原厂方式临时处理，结构可靠性无法保证。',fix:'正确做法：不得用胶带、铁丝等临时修补承力部件；发现异常立即停用并由专业人员鉴定、维修或报废。'},
        {id:11,x:46.3,y:40.0,r:3.6,title:'工具放在梯顶且未防坠',desc:'扳手松放在顶部平台，可能被碰落，击中下方人员。',fix:'正确做法：工具装入工具袋或使用工具防坠绳，不得散放在梯顶。'},
        {id:12,x:33.0,y:66.5,r:6.0,title:'作业区未隔离，人员从下方经过',desc:'有人直接穿过高处作业影响区，存在坠物打击风险。',fix:'正确做法：设置围栏或警戒线，禁止无关人员进入和从下方通行。'}
      ]},
      {id:'structure',name:'场景二：结构参数判断',image:'assets/人字梯结构参数错误场景_v0.1.png',alt:'工厂内一把存在多处结构缺陷的人字梯检查找茬场景',task:'任务：判断 12 个结构参数牌，点出其中 6 个错误参数',sub:'蓝色参数牌里有正确也有错误；不要看颜色，要判断参数说法是否能放行。',source:'判定口径依据：人字梯使用前检查要求。这里用“正确/错误参数混合”训练学员判断参数口径：能支持停用、维修、禁止使用的检查参数为正确；把缺件、裂纹、变形、未锁定、脚垫失效、非原厂修补说成“可用”的参数为错误。当前参数为训练样品，正式教材前需按客户/厂家标准再校准具体数值。',issues:[
        {id:1,isError:false,x:57.7,y:39.2,lx:76,ly:35,r:6.2,label:'铭牌缺失：停用核查',title:'正确参数：铭牌缺失应停用核查',desc:'参数牌把铭牌缺失和停用核查绑定在一起，符合使用前检查逻辑。',fix:'正确做法：铭牌缺失、无法识读时先停用，确认厂家型号和额定载荷后再使用。'},
        {id:2,isError:true,x:58.8,y:58.5,lx:76,ly:52,r:6.2,label:'侧轨弯曲≤30mm：合格',title:'错误参数：弯曲变形被判合格',desc:'梯框承力件已经明显弯曲，不能用“30mm 内合格”这种现场随意参数放行。',fix:'正确做法：梯框、立柱、横撑出现弯曲或凹陷，立即停用并报修或报废。'},
        {id:3,isError:true,x:42.4,y:50.2,lx:22,ly:46,r:6.2,label:'踏板裂纹≤10mm：可用',title:'错误参数：踏板裂纹允许继续用',desc:'踏板裂纹和变形直接影响脚踩承载，不能按裂纹长度简单放行。',fix:'正确做法：踏板、踏棍开裂、松动、变形时不得继续攀登。'},
        {id:4,isError:false,x:66.7,y:18.2,lx:82,ly:18,r:6.2,label:'铰链缺件：立即停用',title:'正确参数：铰链缺件应停用',desc:'铰链锁销或螺栓缺失会影响展开锁定，参数牌要求立即停用是正确的。',fix:'正确做法：检查铰链、锁销、螺栓齐全有效；缺件时立即停用。'},
        {id:5,isError:true,x:57.7,y:60.0,lx:78,ly:64,r:6.2,label:'撑杆未锁：短时可用',title:'错误参数：撑杆未锁仍可用',desc:'撑杆未锁时人字梯没有形成稳定三角结构，短时使用同样可能失稳。',fix:'正确做法：使用前将人字梯完全展开，确认两侧撑杆锁定到位。'},
        {id:6,isError:false,x:65.6,y:70.4,lx:82,ly:75,r:6.2,label:'横撑松动：维修后再用',title:'正确参数：横撑松动需维修',desc:'横撑是限制梯腿位移的重要部件，松动后应维修确认，不能直接使用。',fix:'正确做法：横撑、铆钉、连接片松脱时不得使用，需维修或更换。'},
        {id:7,isError:true,x:33.0,y:89.6,lx:18,ly:82,r:6.2,label:'缺 1 个脚垫：可垫布',title:'错误参数：脚垫缺失可替代',desc:'布、纸板或临时垫物不能替代原厂防滑脚垫，反而可能滑移。',fix:'正确做法：四个脚垫必须齐全完好，缺失即停用。'},

    const stage=document.querySelector('#stage'),img=document.querySelector('#sceneImage'),tabs=document.querySelector('.tabs'),foundEl=document.querySelector('#found'),totalEl=document.querySelector('#total'),attemptsEl=document.querySelector('#attempts'),clockEl=document.querySelector('#clock'),progress=document.querySelector('#progress'),toast=document.querySelector('#toast'),dialog=document.querySelector('#answerDialog'),answers=document.querySelector('#answers'),feedback=document.querySelector('#feedbackCard');
    const state={};let current=scenes[0],hints=3,timer,timerStarted=false,started=Date.now();scenes.forEach(s=>state[s.id]={found:new Set(),attempts:0,seconds:0});

    function addMarker(i,answer=false){if(stage.querySelector(`[data-id="${current.id}-${i.id}"]`))return;const m=document.createElement('span');m.className=answer?'marker answer':'marker';m.dataset.id=`${current.id}-${i.id}`;m.dataset.label=i.id;m.style.left=i.x+'%';m.style.top=i.y+'%';if(answer){m.style.background='#e4493fe6';m.style.boxShadow='0 0 0 5px #e4493f55,0 8px 20px #081f3a66';m.style.fontSize='.86rem';m.style.pointerEvents='none'}stage.append(m)}

    function update(){const s=sceneState(),total=wrongItems().length;foundEl.textContent=s.found.size;totalEl.textContent=total;attemptsEl.textContent=s.attempts;clockEl.textContent=formatTime(s.seconds);progress.style.width=(s.found.size/total*100)+'%';if(s.found.size===total){clearInterval(timer);timerStarted=false;setTimeout(()=>openAnswers(false),450)}}
    function renderTabs(){tabs.innerHTML=scenes.map(s=>`<button class="tab ${s.id===current.id?'active':''}" type="button" data-scene="${s.id}">${s.name}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchScene(b.dataset.scene))}
    function switchScene(id){clearInterval(timer);timerStarted=false;current=scenes.find(s=>s.id===id);hints=3;stage.querySelectorAll('.marker,.miss,.param-label').forEach(n=>n.remove());feedback.className='feedback-card';img.src=current.image;img.alt=current.alt;document.querySelector('#missionText').firstChild.nodeValue=current.task;document.querySelector('#missionSub').textContent=current.sub;document.querySelector('#hintBtn').textContent='给我一个区域提示（3）';renderTabs();renderParamLabels();current.issues.forEach(i=>{if(sceneState().found.has(i.id))addMarker(i)});update();say(`已切换：${current.name}`)}
    stage.addEventListener('click',e=>{startTimer();const rect=stage.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100,s=sceneState();s.attempts++;let hit=current.issues.map(i=>{const defect=Math.hypot((x-i.x)/1.777,y-i.y),label=Number.isFinite(i.lx)?Math.hypot((x-i.lx)/1.777,y-i.ly):defect;return {...i,d:Math.min(defect,label)}}).filter(i=>i.d<=i.r).sort((a,b)=>a.d-b.d)[0];if(hit&&hit.isError===false){explainCorrect(hit);say('这是正确参数，不计入错误得分','ok')}else if(hit){const isNew=!s.found.has(hit.id);s.found.add(hit.id);addMarker(hit);explain(hit);say(isNew?`找对了：${hit.title}`:`这个错误已经找到：${hit.title}`,'ok')}else{const m=document.createElement('span');m.className='miss';m.style.left=x+'%';m.style.top=y+'%';stage.append(m);setTimeout(()=>m.remove(),800);explainMiss();say('这里不是预设错误点','no')}update()});

    document.querySelector('#hintBtn').onclick=()=>{startTimer();if(!hints)return say('提示已用完');const unseen=wrongItems().filter(i=>!sceneState().found.has(i.id));if(!unseen.length)return say('已经全部找到了','ok');const i=unseen[Math.floor(Math.random()*unseen.length)];hints--;document.querySelector('#hintBtn').textContent=`给我一个区域提示（${hints}）`;const pulse=document.createElement('span');pulse.className='marker';pulse.style.left=(i.lx||i.x)+'%';pulse.style.top=(i.ly||i.y)+'%';pulse.style.background='transparent';pulse.style.borderColor='#ffd23f';pulse.style.boxShadow='0 0 0 7px #ffd23f66';pulse.style.animation='pop .3s ease,miss 1.8s .3s ease forwards';stage.append(pulse);setTimeout(()=>pulse.remove(),2100);say('黄色圈只提示区域，不算已找到')};
    document.querySelector('#resetBtn').onclick=()=>{clearInterval(timer);timerStarted=false;state[current.id]={found:new Set(),attempts:0,seconds:0};hints=3;feedback.className='feedback-card';stage.querySelectorAll('.marker,.miss').forEach(n=>n.remove());document.querySelector('#hintBtn').textContent='给我一个区域提示（3）';update();say('已重新开始本场景')};
    renderTabs();switchScene('use');
  </script>
</body>
</html>
